name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Multiplatform Binaries (Linux & macOS)
        run: |
          mkdir -p dist
          # Linux builds
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/ventox-linux-amd64 cmd/ventox/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/ventox-linux-arm64 cmd/ventox/main.go
          # macOS (Darwin) builds
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/ventox-darwin-arm64 cmd/ventox/main.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/ventox-darwin-amd64 cmd/ventox/main.go

          cd dist
          tar -czvf ventox-linux-amd64.tar.gz ventox-linux-amd64
          tar -czvf ventox-linux-arm64.tar.gz ventox-linux-arm64
          tar -czvf ventox-darwin-arm64.tar.gz ventox-darwin-arm64
          tar -czvf ventox-darwin-amd64.tar.gz ventox-darwin-amd64
          sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
