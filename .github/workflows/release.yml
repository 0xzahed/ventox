name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Multiplatform Binaries (Linux, macOS, Windows)
        run: |
          mkdir -p dist
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/ventox-linux-amd64 ./cmd/ventox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/ventox-linux-arm64 ./cmd/ventox
          # macOS
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/ventox-darwin-arm64 ./cmd/ventox
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/ventox-darwin-amd64 ./cmd/ventox
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/ventox-windows-amd64.exe ./cmd/ventox

          cd dist
          tar -czvf ventox-linux-amd64.tar.gz ventox-linux-amd64
          tar -czvf ventox-linux-arm64.tar.gz ventox-linux-arm64
          tar -czvf ventox-darwin-arm64.tar.gz ventox-darwin-arm64
          tar -czvf ventox-darwin-amd64.tar.gz ventox-darwin-amd64
          zip ventox-windows-amd64.zip ventox-windows-amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
